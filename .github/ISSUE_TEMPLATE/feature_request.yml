name: 功能建议
description: 具体、可执行，并能改善飞行、管制或平台使用体验的建议。
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        建议请说明**使用场景**、**要解决的问题**和**可接受的结果**，越具体越容易被评估和实现。
        与已有 issue 重复或仅表达愿望而没有场景的描述，可能无法计分。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下会遇到这个问题？请描述具体流程和受影响的人群。
      placeholder: 例如：管制员在活动期间需要同时管理多个相邻扇区时……
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 现有方式有什么不足？造成了什么影响？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望看到的功能或交互是怎样的？如有界面示意、参考产品或类似实现请一并说明。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 可接受的结果
      description: 满足哪些条件即可认为这个建议被实现？请写明验收标准。
      placeholder: |
        例如：
        - Radar 中可以按扇区筛选在线管制员
        - 筛选条件在刷新后保持
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: 主要受益对象
      options:
        - 飞行员
        - 管制员
        - 教员或学员
        - 管理员
        - 全体成员
        - 其他
    validations:
      required: true

  - type: dropdown
    id: modules
    attributes:
      label: 涉及模块
      description: 可多选；不确定时选择“不确定”。
      multiple: true
      options:
        - 客户端（audio-for-can、MSFS、X-Plane 等）
        - 网页平台（portal、radar）
        - 语音服务
        - 数据或航图
        - 文档
        - 不确定
        - 其他
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或参考
      description: 你考虑过哪些替代做法？是否有其他平台、软件或类似功能的参考？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充材料
      description: 截图、示意图、链接或最小示例。可直接把图片拖拽到输入框。
      render: text
    validations:
      required: false

  - type: input
    id: can_id
    attributes:
      label: CAN ID
      description: 用于发放积分，请勿填写密码、令牌或其他敏感信息。
      placeholder: 例如：5158
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索过已有 issue，确认这不是重复建议。
          required: true
        - label: 我理解维护者可能不采纳该建议，并会说明原因。
          required: false
